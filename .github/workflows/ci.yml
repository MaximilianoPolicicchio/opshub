name: CI

on:
  push:
    # The repository's default branch is `master`. `main` is listed so the
    # workflow keeps working if/when the default branch is migrated, without
    # a window where pushes run no CI at all.
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# A second push to the same branch makes the in-flight run obsolete.
# Cancel it rather than paying for a result nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opshub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opshub_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-please-override-me-32chars
      JWT_REFRESH_SECRET: ci-refresh-secret-please-override-me-32chars
      # The in-process cron must stay off: it would race the tests by mutating
      # project health and firing webhooks mid-assertion.
      SCHEDULER_ENABLED: "false"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose: pnpm/action-setup@v6 errors out when the
      # version is declared both here and in package.json's `packageManager`.
      # `packageManager` wins so CI and local use byte-identical pnpm.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The TimeEntry overlap guard is a GiST exclusion constraint over
      # (userId, tstzrange), which needs btree_gist for the equality operator.
      # Without it `migrate deploy` fails with a confusing operator-class error,
      # so make the real cause obvious and fail early.
      - name: Enable btree_gist
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d opshub_test \
            -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d opshub_test \
            -tAc "SELECT extname FROM pg_extension WHERE extname='btree_gist';" | grep -q btree_gist

      - name: Prisma validate
        run: pnpm --filter @opshub/api exec prisma validate

      - name: Prisma generate
        run: pnpm --filter @opshub/api exec prisma generate

      - name: Build shared contracts (types needed by both apps)
        run: pnpm --filter @opshub/contracts build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Migrate test database
        run: pnpm --filter @opshub/api exec prisma migrate deploy

      - name: API unit tests
        run: pnpm --filter @opshub/api test

      - name: Seed test database
        run: pnpm --filter @opshub/api db:seed

      - name: API e2e tests
        run: pnpm --filter @opshub/api test:e2e

      - name: Build API
        run: pnpm --filter @opshub/api build

      - name: Build web
        run: pnpm --filter @opshub/web build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Playwright starts the API and web servers itself (see
      # playwright.config.ts) against the same Postgres service used above.
      - name: Browser end-to-end tests
        run: pnpm exec playwright test
        env:
          NEXT_OUTPUT_STANDALONE: "false"
          COOKIE_SECURE: "false"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose: pnpm/action-setup@v6 errors out when the
      # version is declared both here and in package.json's `packageManager`.
      # `packageManager` wins so CI and local use byte-identical pnpm.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tightened from `critical` to `high` once the Next.js 15 upgrade cleared
      # the last outstanding high advisory. There are now no accepted
      # exceptions, so a new high is genuinely new. See ADR 0007.
      - name: Audit production dependencies (fail on high)
        run: pnpm audit --prod --audit-level high

      - name: Report high and moderate advisories (non-blocking)
        if: always()
        run: pnpm audit --prod || true
