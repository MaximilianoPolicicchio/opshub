name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opshub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opshub_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-please-override-me-32chars
      JWT_REFRESH_SECRET: ci-refresh-secret-please-override-me-32chars
      SCHEDULER_ENABLED: "false"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm --filter @opshub/api exec prisma validate

      - name: Prisma generate
        run: pnpm --filter @opshub/api exec prisma generate

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Migrate test database
        run: pnpm --filter @opshub/api exec prisma migrate deploy

      - name: API unit tests
        run: pnpm --filter @opshub/api test

      - name: Seed test database
        run: pnpm --filter @opshub/api db:seed

      - name: API e2e tests
        run: pnpm --filter @opshub/api test:e2e

      - name: Build API
        run: pnpm --filter @opshub/api build

      - name: Build web
        run: pnpm --filter @opshub/web build
